name: "Build & Test"

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.swift'
      - 'mise.toml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/*.swift'
      - 'mise.toml'

jobs:
  build-test:
    name: Build & Test
    runs-on: xcode-27
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Mise
      uses: jdx/mise-action@v2

    - name: Log in Tuist
      run: |
        tuist auth login

    - name: Install Dependencies
      run: |
        tuist install

    - name: Setup Tuist Cache Service
      run: |
        tuist setup cache

    - name: Test App
      env:
        SCHEME: App
      run: |
        tuist test
