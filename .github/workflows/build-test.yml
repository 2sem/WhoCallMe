name: "Build & Test"

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.swift'
      - 'mise.toml'
      - 'Tuist/Package.resolved'
      - '.github/workflows/build-test.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/*.swift'
      - 'mise.toml'
      - 'Tuist/Package.resolved'
      - '.github/workflows/build-test.yml'

jobs:
  build-test:
    name: Build & Test
    runs-on: xcode-27
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install Mise
      uses: jdx/mise-action@v5

    - name: Cache Tuist dependencies
      id: tuist-cache
      uses: actions/cache@v6
      with:
        path: |
          Tuist/.build
          ~/.cache/swifterpm
          ~/.cache/tuist
        key: tuist-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tuist/Package.resolved') }}

    - name: Log in Tuist
      run: |
        tuist auth login

    - name: Install Dependencies
      run: |
        tuist install

    - name: Setup Tuist Cache Service
      if: steps.tuist-cache.outputs.cache-hit == 'true'
      run: |
        tuist setup cache

    - name: Boot simulator (timing)
      run: |
        UDID=$(xcrun simctl list devices available -j | python3 -c '
        import json, sys
        runtimes = json.load(sys.stdin)["devices"]
        for rt in sorted(runtimes, reverse=True):
            if "iOS" not in rt:
                continue
            for d in runtimes[rt]:
                if d["name"].startswith("iPhone") and d.get("isAvailable", True):
                    print(d["udid"])
                    sys.exit(0)
        ')
        echo "Using simulator $UDID"
        date
        xcrun simctl boot "$UDID" || true
        time xcrun simctl bootstatus "$UDID" -b
        date
        xcrun simctl list devices booted

    - name: Test App
      env:
        SCHEME: App
        # Build from sources when the GitHub dependency cache missed (no Tuist cache service).
        TUIST_TEST_BINARY_CACHE: ${{ steps.tuist-cache.outputs.cache-hit == 'true' && 'true' || 'false' }}
      run: |
        time tuist test
